<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Journal App — Flutter UI Simulator</title>
<style>
/* ===== AppTheme Design Tokens ===== */
:root {
  --bg: #F7F9F7;
  --surface: #FFFFFF;
  --accent: #34D399;
  --accent-light: #D1FAE5;
  --text-primary: #1F2937;
  --text-secondary: #9CA3AF;
  --text-muted: #D1D5DB;
  --danger: #F87171;
  --danger-light: #FEE2E2;
  --radius-xs: 8px;
  --radius-sm: 12px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --shadow-card: 0 2px 12px rgba(0,0,0,0.04);
  --shadow-sm: 0 1px 8px rgba(0,0,0,0.03);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #E5E7EB;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.phone-frame {
  width: 390px;
  height: 844px;
  background: var(--bg);
  border-radius: 40px;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15), 0 0 0 2px #1a1a1a;
  display: flex;
  flex-direction: column;
  position: relative;
}

/* Status bar */
.status-bar {
  background: var(--surface);
  padding: 14px 24px 6px;
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
  flex-shrink: 0;
}

/* App content area */
.page { display: none; flex-direction: column; flex: 1; overflow: hidden; }
.page.active { display: flex; }

/* Shared components */
.header {
  background: var(--surface);
  padding: 16px 20px 12px;
  flex-shrink: 0;
}
.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.heading-large { font-size: 20px; font-weight: 700; color: var(--text-primary); }
.body-text { font-size: 14px; color: var(--text-secondary); }

.scroll-area {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

/* Cards */
.card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  margin: 8px 16px;
  padding: 16px;
}
.card-sm {
  background: var(--surface);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-card);
  margin: 4px 16px;
  padding: 16px;
}

/* Buttons */
.btn-accent {
  background: var(--accent);
  color: white;
  border: none;
  border-radius: var(--radius-sm);
  padding: 10px 20px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.1s;
}
.btn-accent:active { transform: scale(0.95); }
.btn-circle {
  width: 42px; height: 42px;
  background: var(--accent);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.1s;
}
.btn-circle:active { transform: scale(0.9); }
.btn-circle svg { width: 18px; height: 18px; color: white; }

/* Chips */
.chip {
  padding: 5px 12px;
  border-radius: 14px;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
  border: 1px solid #E5E7EB;
  background: #FAFAFA;
  color: var(--text-secondary);
}
.chip.active {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}

/* Input */
.input-row {
  background: var(--surface);
  padding: 10px 16px 16px;
  border-top: 1px solid #F3F4F6;
  display: flex;
  gap: 10px;
  flex-shrink: 0;
}
.input-row input {
  flex: 1;
  border: none;
  background: var(--bg);
  border-radius: 20px;
  padding: 10px 16px;
  font-size: 13px;
  outline: none;
}
.input-row input::placeholder { color: var(--text-muted); }

/* Bottom nav */
.bottom-nav {
  background: var(--surface);
  display: flex;
  padding: 8px 0;
  flex-shrink: 0;
  border-top: 1px solid #F3F4F6;
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  cursor: pointer;
  padding: 4px 0;
  transition: transform 0.1s;
}
.nav-item:active { transform: scale(0.9); }
.nav-item svg { width: 22px; height: 22px; }
.nav-item .nav-label { font-size: 10px; }
.nav-item.active .nav-label { color: var(--accent); font-weight: 600; }

/* Misc */
.mood-emoji { font-size: 22px; }
.mood-label {
  display: inline-block;
  font-size: 11px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: var(--radius-xs);
}
.tag {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: var(--radius-xs);
  background: #DBEAFE;
  color: #60A5FA;
}
.ai-bubble {
  background: #F3E8FF;
  border-radius: var(--radius-sm);
  padding: 10px;
  margin-top: 8px;
  font-size: 12px;
  color: #7C3AED;
  line-height: 1.4;
}
.stat-row {
  display: flex;
  gap: 14px;
  font-size: 12px;
  color: var(--text-secondary);
}
.stat-row span { display: flex; align-items: center; gap: 3px; }
.stat-row svg { width: 14px; height: 14px; }

.hug-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.hug-btn.liked { background: var(--danger-light); color: var(--danger); }
.hug-btn:not(.liked) { background: #F9FAFB; color: var(--text-secondary); }

.badge-dot {
  width: 18px; height: 18px;
  background: var(--danger);
  color: white;
  font-size: 10px;
  font-weight: 700;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.search-bar {
  background: var(--surface);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-sm);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 10px;
}
.search-bar input {
  border: none; outline: none; font-size: 13px; flex: 1;
}
.search-bar input::placeholder { color: var(--text-muted); }

.avatar {
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #FDE68A, #FCD34D);
  flex-shrink: 0;
  cursor: pointer;
}

/* Locked card */
.locked-card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  margin: 6px 16px;
  padding: 20px;
  display: flex;
  align-items: center;
  gap: 12px;
}

/* Toast */
.toast {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.8);
  background: #1F2937;
  color: white;
  padding: 10px 24px;
  border-radius: 20px;
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s;
  z-index: 999;
}
.toast.show {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

/* Transitions */
.slide-in { animation: slideIn 0.25s ease-out; }
@keyframes slideIn {
  from { opacity: 0; transform: translateX(40px); }
  to { opacity: 1; transform: translateX(0); }
}

/* Empty state */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 60px 20px;
  color: var(--text-secondary);
  text-align: center;
}
.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
.empty-state .empty-title { font-size: 15px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
.empty-state .empty-sub { font-size: 13px; }

/* Menu item */
.menu-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px;
  background: var(--surface);
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-card);
  margin: 4px 16px;
  cursor: pointer;
  transition: transform 0.1s;
}
.menu-item:active { transform: scale(0.98); }
.menu-item .menu-icon { color: var(--text-secondary); }
.menu-item .menu-title { flex: 1; font-size: 14px; color: var(--text-primary); }

/* Mood bar */
.mood-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.mood-bar .bar-fill {
  height: 8px;
  background: var(--accent);
  border-radius: 4px;
  transition: width 0.5s;
}
.mood-bar .bar-track {
  flex: 1; height: 8px; background: #F3F4F6; border-radius: 4px; overflow: hidden;
}

/* Interest tag */
.interest-tag {
  padding: 3px 10px;
  border-radius: 10px;
  background: #DBEAFE;
  color: #60A5FA;
  font-size: 11px;
}
</style>
</head>
<body>

<div class="phone-frame" id="app">
  <!-- Status bar -->
  <div class="status-bar">
    <span>9:41</span>
    <span id="pageTitle">日记</span>
    <span>📶 🔋</span>
  </div>

  <!-- ============ TIMELINE PAGE ============ -->
  <div class="page active" id="page-timeline">
    <div class="header">
      <div class="header-row">
        <div>
          <div class="heading-large" id="greeting">早安，小兔</div>
          <div class="body-text" id="subGreeting" style="margin-top:2px">新的一天，从这里开始</div>
        </div>
        <div class="btn-circle" onclick="navigateTo('write')" title="写日记">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </div>
      </div>
      <div class="search-bar">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9CA3AF" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" placeholder="搜索日记..." id="searchInput" oninput="filterDiaries()">
        <span onclick="clearSearch()" style="cursor:pointer;color:var(--text-muted);font-size:16px;display:none" id="clearSearch">✕</span>
      </div>
    </div>
    <div class="scroll-area" id="timelineList"></div>
    <div class="input-row" style="display:none" id="timelineReplyBar">
      <input type="text" placeholder="写评论..." id="timelineReplyInput">
      <div class="btn-circle" onclick="sendTimelineReply()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22,2 15,22 11,13 2,9"/></svg>
      </div>
    </div>
  </div>

  <!-- ============ DISCOVER PAGE ============ -->
  <div class="page" id="page-discover">
    <div class="header">
      <div class="header-row">
        <div class="heading-large">发现同频</div>
        <div style="display:flex;gap:6px">
          <span class="chip active" id="feedAll" onclick="setFeed('all')">全部</span>
          <span class="chip" id="feedFollowing" onclick="setFeed('following')">已关注</span>
        </div>
      </div>
      <div style="display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding-bottom:4px" id="moodFilterRow"></div>
      <div style="display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:4px" id="tagFilterRow"></div>
    </div>
    <div class="scroll-area" id="discoverList"></div>
  </div>

  <!-- ============ MESSAGES PAGE ============ -->
  <div class="page" id="page-messages" style="background:var(--bg)">
    <div class="header" style="border-bottom:1px solid #F3F4F6">
      <div class="heading-large">消息中心</div>
    </div>
    <div class="scroll-area" style="padding:16px">
      <div class="card-sm" onclick="navigateTo('conversations')" style="cursor:pointer">
        <div style="display:flex;align-items:center;gap:14px">
          <div style="width:42px;height:42px;background:var(--bg);border-radius:12px;display:flex;align-items:center;justify-content:center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="1.5"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </div>
          <span style="flex:1;font-size:15px;font-weight:500;color:var(--text-primary)">私信</span>
          <span class="badge-dot" id="msgBadge" style="display:none">3</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2"><polyline points="9,18 15,12 9,6"/></svg>
        </div>
      </div>
      <div class="card-sm" onclick="navigateTo('contacts')" style="margin-top:10px;cursor:pointer">
        <div style="display:flex;align-items:center;gap:14px">
          <div style="width:42px;height:42px;background:var(--accent-light);border-radius:12px;display:flex;align-items:center;justify-content:center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="1.5"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg>
          </div>
          <span style="flex:1;font-size:15px;font-weight:500;color:var(--text-primary)">已认识</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2"><polyline points="9,18 15,12 9,6"/></svg>
        </div>
      </div>
      <div class="card-sm" onclick="navigateTo('greet')" style="margin-top:10px;cursor:pointer">
        <div style="display:flex;align-items:center;gap:14px">
          <div style="width:42px;height:42px;background:var(--bg);border-radius:12px;display:flex;align-items:center;justify-content:center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="1.5"><path d="M7 11v8a1 1 0 01-1 1H4a1 1 0 01-1-1v-8a1 1 0 011-1h2a1 1 0 011 1z"/><path d="M7 11l4-7c.8-1.3 2.4-.9 2.7.6L15 9h4a2 2 0 012 2v4a2 2 0 01-2 2h-6.5a2 2 0 01-1.6-.8l-2.4-3.2"/></svg>
          </div>

          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2"><polyline points="9,18 15,12 9,6"/></svg>
        </div>
      </div>
      <div class="card-sm" onclick="navigateTo('notifications')" style="margin-top:10px;cursor:pointer">
        <div style="display:flex;align-items:center;gap:14px">
          <div style="width:42px;height:42px;background:var(--bg);border-radius:12px;display:flex;align-items:center;justify-content:center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="1.5"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          </div>
          <span style="flex:1;font-size:15px;font-weight:500;color:var(--text-primary)">通知</span>
          <span class="badge-dot" id="notifBadge">5</span>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2"><polyline points="9,18 15,12 9,6"/></svg>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ TREEHOLE PAGE ============ -->
  <div class="page" id="page-treehole">
    <div class="header">
      <div class="header-row">
        <div class="heading-large">树洞</div>
        <button class="chip active" onclick="refreshTreehole()" style="border:none">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline;vertical-align:middle"><polyline points="23,4 23,10 17,10"/><path d="M20.49 15a9 9 0 11-2.12-9.36L23 10"/></svg>

      </div>
    </div>

    <div class="input-row" id="treeholeReplyBar">
      <input type="text" placeholder="匿名回复..." id="treeholeReplyInput">
      <div class="btn-circle" onclick="sendTreeholeReply()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22,2 15,22 11,13 2,9"/></svg>
      </div>
    </div>
  </div>

  <!-- ============ PROFILE PAGE ============ -->
  <div class="page" id="page-profile" style="background:var(--bg)">
    <div class="scroll-area">
      <div style="background:var(--surface);padding:24px 20px 20px;border-bottom:1px solid #F3F4F6">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <div class="heading-large">我的</div>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2" style="cursor:pointer" onclick="navigateTo('safety')"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>

        </div>
      </div>
      <div style="height:10px"></div>
      <div class="menu-item" onclick="navigateTo('stats')">
        <svg class="menu-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span class="menu-title">统计看板</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2"><polyline points="9,18 15,12 9,6"/></svg>
      </div>
      <div class="menu-item" onclick="navigateTo('capsules')">
        <svg class="menu-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1010 10"/><path d="M12 6v6l4 2"/></svg>
        <span class="menu-title">时光胶囊</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2"><polyline points="9,18 15,12 9,6"/></svg>
      </div>
      <div class="menu-item" onclick="navigateTo('safety')">
        <svg class="menu-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span class="menu-title">安全中心</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2"><polyline points="9,18 15,12 9,6"/></svg>

// ===== NAVIGATION =====
function switchTab(tab) {
  currentTab = tab;
  pageStack = [];
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

  const pageMap = {timeline:'page-timeline', discover:'page-discover', messages:'page-messages', treehole:'page-treehole', profile:'page-profile'};
  const targetPage = pageMap[tab];
  if (targetPage) document.getElementById(targetPage).classList.add('active');

  document.querySelector(`.nav-item[data-page="${tab}"]`).classList.add('active');
  document.getElementById('pageTitle').textContent = {timeline:'日记', discover:'发现', messages:'消息', treehole:'树洞', profile:'我的'}[tab];

  // Hide detail reply bar for non-timeline
  document.getElementById('timelineReplyBar').style.display = 'none';

  if (tab === 'discover') renderDiscover();
  if (tab === 'treehole') renderTreehole();
}

function navigateTo(screen) {
  pageStack.push({tab: currentTab, screen: screen});

  if (screen === 'write') {
    showToast('📝 打开写日记界面');
    return;
  }

  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-detail').classList.add('active');
  document.getElementById('pageTitle').textContent = {
    write:'写日记', detail:'日记详情', conversations:'私信', contacts:'已认识',
    greet:'打招呼', notifications:'通知', stats:'统计看板', capsules:'时光胶囊',
    safety:'安全中心', editProfile:'编辑资料', userProfile:'用户主页'
  }[screen] || screen;

  if (screen === 'conversations') renderConversations();
  if (screen === 'notifications') renderNotifications();
  if (screen === 'stats') renderStats();
  if (screen === 'capsules') renderCapsules();
  if (screen === 'safety') renderSafety();
  if (screen === 'greet') renderGreet();
  if (screen === 'contacts') renderContacts();
}

function goBack() {
  if (pageStack.length > 0) {
    pageStack.pop();
    switchTab(currentTab);
  }
}

    repliesHtml = `
    <div class="card" style="margin:0 16px 16px">
      <div style="font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:12px">回复 (${treeholeReplies.length})</div>
      ${treeholeReplies.map(r => `
        <div style="margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid #F3F4F6">
          <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">
            <span style="font-size:16px">🎭</span>
            <span style="font-size:13px;font-weight:600;color:var(--text-primary)">${r.anonName}</span>
            <span style="font-size:10px;color:var(--text-muted)">${r.createdAt}</span>
          </div>
          <div style="font-size:13px;color:var(--text-primary)">${r.content}</div>
          <div style="font-size:11px;color:var(--text-secondary);margin-top:2px;cursor:pointer" onclick="replyToTreehole('${r.anonName}')">回复</div>
        </div>
      `).join('')}
    </div>`;
  }

  document.getElementById('treeholeContent').innerHTML = html + repliesHtml;
}

function toggleHug() {
  treeholeHugged = !treeholeHugged;
  treeholeHugCount += treeholeHugged ? 1 : -1;
  showToast(treeholeHugged ? '🤗 送出了一个抱抱' : '收回了抱抱');
  renderTreehole();
}

function refreshTreehole() {
  showToast('🔄 正在打捞新的漂流瓶...');
  setTimeout(() => {
    treeholeHugged = false;
    treeholeHugCount = Math.floor(Math.random() * 15) + 1;
    renderTreehole();
  }, 600);
}

function replyToTreehole(name) {
  const input = document.getElementById('treeholeReplyInput');
  input.value = `回复 ${name}: `;
  input.focus();
}

function sendTreeholeReply() {
  const input = document.getElementById('treeholeReplyInput');
  const content = input.value.trim();
  if (!content) return;

  treeholeReplies.push({
    anonName: '匿名' + ['小猫','小鱼','星星','月亮','微风'][Math.floor(Math.random()*5)],
    content: content,
    createdAt: new Date().toISOString().substring(0,16).replace('T',' ')
  });
  input.value = '';
  renderTreehole();
  showToast('回复成功');
}

// ===== MESSAGES =====
function renderConversations() {
  let html = '';
  if (sampleMessages.length === 0) {
    html = '<div class="empty-state"><div class="empty-icon">📧</div><div class="empty-title">暂无会话</div><div class="empty-sub">和好友打个招呼开始聊天吧</div></div>';
  } else {
    html = sampleMessages.map(m => `
      <div style="padding:12px 16px;border-bottom:1px solid #F3F4F6;display:flex;align-items:center;gap:12px;cursor:pointer" onclick="openChat(${m.id})">
        <div class="avatar" style="width:44px;height:44px;font-size:20px">${m.otherUserAvatar}</div>
        <div style="flex:1">
          <div style="font-size:14px;font-weight:600;color:var(--text-primary)">${m.otherUserName}</div>
          <div style="font-size:13px;color:var(--text-secondary)">${m.lastMessage}</div>
        </div>
        ${m.unreadCount > 0 ? `<span class="badge-dot">${m.unreadCount}</span>` : ''}
      </div>
    `).join('');
  }

  document.getElementById('detailContent').innerHTML = html;
  document.getElementById('detailReplyBar').style.display = 'none';
}

function openChat(id) {
  const msg = sampleMessages.find(m => m.id === id);
  if (!msg) return;

  document.getElementById('pageTitle').textContent = msg.otherUserName;
  document.getElementById('detailContent').innerHTML = `
    <div style="display:flex;flex-direction:column;gap:10px;padding:16px">
      <div style="display:flex;justify-content:flex-start"><div style="background:#F3F4F6;padding:10px 14px;border-radius:16px 16px 16px 4px;max-width:75%;font-size:14px">你好呀~</div></div>
      <div style="display:flex;justify-content:flex-end"><div style="background:var(--accent);color:white;padding:10px 14px;border-radius:16px 16px 4px 16px;max-width:75%;font-size:14px">你好！最近怎么样？</div></div>
      <div style="display:flex;justify-content:flex-start"><div style="background:#F3F4F6;padding:10px 14px;border-radius:16px 16px 16px 4px;max-width:75%;font-size:14px">${msg.lastMessage}</div></div>
    </div>`;
  document.getElementById('detailReplyBar').style.display = 'flex';
}

function renderNotifications() {
  document.getElementById('detailContent').innerHTML = sampleNotifications.map(n => `
    <div style="padding:12px 16px;border-bottom:1px solid #F3F4F6;display:flex;align-items:center;gap:12px">
      <div style="width:40px;height:40px;border-radius:50%;background:${n.isRead?'var(--bg)':'var(--accent-light)'};display:flex;align-items:center;justify-content:center">
        <span style="font-size:16px">${n.type==='follow'?'👤':n.type==='comment'?'💬':n.type==='like'?'⭐':n.type==='hug'?'🤗':'👋'}</span>
      </div>
      <div style="flex:1">
        <div style="font-size:14px;color:var(--text-primary);font-weight:${n.isRead?'400':'600'}">${n.message}</div>
        <div style="font-size:12px;color:var(--text-secondary)">${n.createdAt.substring(5,16)}</div>
      </div>
      ${!n.isRead ? '<div style="width:8px;height:8px;background:var(--accent);border-radius:50%"></div>' : ''}
    </div>
  `).join('');
  document.getElementById('detailReplyBar').style.display = 'none';
}

// ===== STATS =====
function renderStats() {
  document.getElementById('detailContent').innerHTML = `
    <div style="padding:20px">
      <div style="font-size:16px;font-weight:600;color:var(--text-primary);margin-bottom:12px">心情分布</div>
      ${Object.entries(moodColors).map(([mood, colors]) => {
        const count = Math.floor(Math.random()*10)+1;
        const pct = count / 10;
        return `
        <div class="mood-bar">
          <span style="font-size:20px">${mood}</span>
          <span style="font-size:12px;width:40px;color:var(--text-secondary)">${colors.label}</span>
          <span style="font-size:13px;color:var(--text-secondary);width:20px">${count}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${pct*100}%"></div></div>
        </div>`;
      }).join('')}

      <div class="card" style="margin:20px 0;padding:16px">
        <div style="display:flex;justify-content:space-between;padding:8px 0"><span style="color:var(--text-secondary)">日记总数</span><b style="color:var(--text-primary)">42</b></div>
        <div style="height:1px;background:#F3F4F6"></div>
        <div style="display:flex;justify-content:space-between;padding:8px 0"><span style="color:var(--text-secondary)">公开日记</span><b style="color:var(--text-primary)">18</b></div>
        <div style="height:1px;background:#F3F4F6"></div>
        <div style="display:flex;justify-content:space-between;padding:8px 0"><span style="color:var(--text-secondary)">时光胶囊</span><b style="color:var(--text-primary)">5</b></div>
      </div>
    </div>`;
  document.getElementById('detailReplyBar').style.display = 'none';
}

// ===== CAPSULES =====
function renderCapsules() {
  const capsules = sampleDiaries.filter(d => d.locked);
  document.getElementById('detailContent').innerHTML = capsules.map(d => `
    <div class="locked-card" style="margin:6px 0">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
      <div style="flex:1"><div style="font-size:14px;font-weight:500;color:var(--text-secondary)">时光胶囊 · 等待解锁</div><div style="font-size:12px;color:var(--text-muted);margin-top:4px">${d.unlockDate} 解锁</div></div>
      <span style="font-size:20px">${d.mood}</span>
    </div>
  `).join('') + '<div style="text-align:center;padding:20px;color:var(--text-secondary);font-size:13px">点击右上角 + 创建新胶囊</div>';
  document.getElementById('detailReplyBar').style.display = 'none';
}

// ===== SAFETY =====
function renderSafety() {
  document.getElementById('detailContent').innerHTML = `
    <div style="padding:16px">
      <div style="font-size:14px;font-weight:600;color:var(--text-primary);margin-bottom:8px">拉黑列表 (0)</div>
      <div class="empty-state" style="padding:30px"><div class="empty-icon">🚫</div><div class="empty-title">没有拉黑的用户</div></div>
      <div style="font-size:14px;font-weight:600;color:var(--text-primary);margin:16px 0 8px">举报记录 (0)</div>
      <div class="empty-state" style="padding:30px"><div class="empty-icon">🏴</div><div class="empty-title">没有提交过举报</div></div>
    </div>`;
  document.getElementById('detailReplyBar').style.display = 'none';
}

// ===== GREET =====
function renderGreet() {
  document.getElementById('detailContent').innerHTML = `
    <div style="text-align:center;padding:16px;font-weight:600;color:var(--text-primary)">收到的 (0) | 发出的 (0)</div>
    <div class="empty-state" style="padding:30px"><div class="empty-icon">👋</div><div class="empty-title">暂无数据</div></div>`;
  document.getElementById('detailReplyBar').style.display = 'none';
}

// ===== CONTACTS =====
function renderContacts() {
  document.getElementById('detailContent').innerHTML = `
    <div class="empty-state" style="padding:30px"><div class="empty-icon">👥</div><div class="empty-title">还没有已认识的人</div><div class="empty-sub">和感兴趣的人打招呼吧</div></div>`;
  document.getElementById('detailReplyBar').style.display = 'none';
}

// ===== DETAIL REPLY =====
function sendDetailReply() {
  const input = document.getElementById('detailReplyInput');
  const content = input.value.trim();
  if (!content) return;
  input.value = '';
  showToast('评论发送成功');
}

function sendTimelineReply() {
  const input = document.getElementById('timelineReplyInput');
  const content = input.value.trim();
  if (!content) return;
  input.value = '';
  showToast('评论发送成功');
}

// ===== TOAST =====
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toast._timeout);
  toast._timeout = setTimeout(() => toast.classList.remove('show'), 1500);
}

// ===== INIT =====
function init() {
  renderTimeline();
  updateGreeting();
}

function updateGreeting() {
  const hour = new Date().getHours();
  let greeting, sub;
  if (hour < 6) { greeting = '夜深了，小兔'; sub = '失眠也没关系，我陪着你'; }
  else if (hour < 12) { greeting = '早安，小兔'; sub = '新的一天，从这里开始'; }
  else if (hour < 18) { greeting = '下午好，小兔'; sub = '喝杯茶，记录今天的点滴'; }
  else { greeting = '晚上好，小兔'; sub = '回顾今天，温柔对待自己'; }
  document.getElementById('greeting').textContent = greeting;
  document.getElementById('subGreeting').textContent = sub;
}

init();
</script>
